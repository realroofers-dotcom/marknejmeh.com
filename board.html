<style>
:root{
  --paper:#0F1113; --panel:#171A1D; --panel2:#1E2226;
  --ink:#E8EAE6; --ink2:#9BA5A0; --ink3:#6E7873;
  --hot:#E1573A; --mark:#7FD8A6; --rule:#2A2F33;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --body:"Public Sans",system-ui,sans-serif;
  --disp:Bitter,Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16.5px/1.65 var(--body);-webkit-font-smoothing:antialiased}

/* ---------- the door ---------- */
#door{min-height:100vh;display:grid;place-items:center;padding:24px}
#door .box{width:100%;max-width:380px;text-align:center}
#door h1{font:700 26px/1.15 var(--disp);margin:0 0 8px}
#door p{color:var(--ink2);font-size:14.5px;margin:0 0 22px}
#door input{width:100%;background:var(--panel);border:1.5px solid var(--rule);
  border-radius:6px;padding:15px 16px;font:500 16px var(--mono);color:var(--ink);
  letter-spacing:.04em;text-align:center;font-size:15px}
#door input:focus{outline:none;border-color:var(--mark)}
#door button{width:100%;margin-top:10px;background:var(--hot);color:#fff;border:0;
  border-radius:6px;padding:15px;font:700 16px var(--body);cursor:pointer}
#door button:hover{background:#C8462C}
#door .err{color:var(--hot);font-size:14px;margin-top:14px;min-height:20px}
#door .note{color:var(--ink3);font-size:12px;margin-top:24px;line-height:1.6}

/* ---------- the document ---------- */
#doc{display:none;max-width:920px;margin:0 auto;padding:34px 26px 110px}
#doc h1{font:700 clamp(28px,4.4vw,40px)/1.12 var(--disp);letter-spacing:-.02em;
  margin:46px 0 16px;padding-top:26px;border-top:2px solid var(--ink)}
#doc h1:first-child{margin-top:0;border-top:0;padding-top:0}
#doc h2{font:700 clamp(21px,3vw,27px)/1.2 var(--disp);margin:38px 0 12px;color:var(--ink)}
#doc h3{font:600 18px/1.3 var(--body);margin:28px 0 10px;color:var(--mark);
  letter-spacing:.01em}
#doc p{margin:0 0 14px;max-width:78ch}
#doc strong{color:#fff}
#doc em{color:var(--ink2)}
#doc a{color:var(--mark)}
#doc hr{border:0;border-top:1px solid var(--rule);margin:34px 0}
#doc ul,#doc ol{max-width:78ch;padding-left:22px}
#doc li{margin:0 0 7px}
#doc code{font:400 13.5px var(--mono);background:var(--panel2);padding:2px 6px;
  border-radius:3px;color:#CFE8DA}
#doc pre{background:var(--panel);border:1px solid var(--rule);border-radius:6px;
  padding:18px 20px;overflow-x:auto;margin:0 0 20px}
#doc pre code{background:none;padding:0;font-size:13px;line-height:1.55;color:var(--ink2)}
#doc blockquote{margin:0 0 20px;padding:16px 20px;background:var(--panel);
  border-left:3px solid var(--hot);border-radius:0 6px 6px 0;max-width:78ch}
#doc blockquote p:last-child{margin-bottom:0}
#doc table{border-collapse:collapse;width:100%;margin:0 0 22px;font-size:15px}
#doc th{text-align:left;font:600 11.5px var(--mono);text-transform:uppercase;
  letter-spacing:.09em;color:var(--ink3);padding:9px 12px;
  border-bottom:1.5px solid var(--rule)}
#doc td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
#doc tr:hover td{background:var(--panel)}
#doc td strong{color:#fff}

.bar{position:sticky;top:0;background:rgba(15,17,19,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--rule);padding:11px 26px;display:flex;gap:16px;
  align-items:center;font:500 12px var(--mono);color:var(--ink3);z-index:9}
.bar b{color:var(--ink)}
.bar button{margin-left:auto;background:none;border:1px solid var(--rule);
  color:var(--ink2);border-radius:4px;padding:6px 12px;font:500 11.5px var(--mono);
  cursor:pointer}
.bar button:hover{color:var(--ink);border-color:var(--ink2)}
@media print{.bar{display:none}}

function b64(s){
  var raw = atob(s), a = new Uint8Array(raw.length);
  for (var i=0;i<raw.length;i++) a[i] = raw.charCodeAt(i);
  return a;
}

async function open_(){
  var pw = document.getElementById('pw').value;
  var err = document.getElementById('err');
  if (!pw){ err.textContent = 'Type the password.'; return; }
  err.textContent = 'Opening…';
  try {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: b64(BLOB.salt), iterations: BLOB.iter, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv: b64(BLOB.iv) }, key, b64(BLOB.ct));
    document.getElementById('doc').innerHTML = new TextDecoder().decode(plain);
    document.getElementById('door').style.display = 'none';
    document.getElementById('wrap').style.display = 'block';
    document.getElementById('doc').style.display = 'block';
    document.title = 'The Board';
  } catch(e){
    err.textContent = 'Wrong password.';
  }
}

document.getElementById('go').addEventListener('click', open_);
document.getElementById('pw').addEventListener('keydown', function(e){
  if (e.key === 'Enter') open_();
});
document.getElementById('pw').focus();
</script>
</body>
